server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/account_dept_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  cors:
    # Nhiều origin cách nhau bằng dấu phẩy
    allowedOrigin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://127.0.0.1:5500}
  jwt:
    # Bắt buộc >= 32 ký tự. Khi deploy hãy đặt biến môi trường JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789}
    expirationMs: 3600000
    rememberExpirationMs: 1209600000
  info:
    name: "Hệ thống Quản lý Nhân sự UTH"
    version: "1.0.0"

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
